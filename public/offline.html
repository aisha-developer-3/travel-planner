<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Travel Planner</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #F5F8FC;
        color: #172B42;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #FFFFFF;
        border: 1px solid #E5ECF3;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(23, 43, 66, 0.06);
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: #EBF5FF;
        color: #1687D9;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #718096;
      }
      button {
        background: #1687D9;
        color: #FFFFFF;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline Mode</div>
      <h1>You are currently offline</h1>
      <p>Your saved trips, itineraries, packing lists, bookings, documents, and notes remain stored locally on this device.</p>
      <button onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
